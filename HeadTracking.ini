; Assassin's Creed Unity Head Tracking Configuration
; This file ships with sensible defaults; edit to taste. Delete to reset.

[Network]
; UDP port for OpenTrack data (default: 4242)
UDPPort=4242

[Sensitivity]
YawMultiplier=1.0
PitchMultiplier=1.0
; Roll reduced for third-person (default: 0.5). ACU is primarily a
; third-person parkour game, and unchecked roll whips the horizon on
; every rooftop landing. Raise to 1.0 for a more expressive tilt.
RollMultiplier=0.5
; 0.0 = minimum (a 0.15 floor is applied internally to kill jitter).
; 1.0 = heavy smoothing (~5s settling).
Smoothing=0.0

[Position]
; Position sensitivity multipliers. ACU's follow camera sits close to
; Arno's back, so 1.0 is plenty - you'll hit the limit before you
; clip through geometry.
SensitivityX=1.0
SensitivityY=1.0
SensitivityZ=1.0
; Positional limits in meters. Kept conservative to match ACU's tight
; follow-camera; raise these only if you want more leaning room.
LimitX=0.20
LimitY=0.15
LimitZ=0.25
LimitZBack=0.05
Smoothing=0.15
InvertX=true
InvertY=false
InvertZ=false
Enabled=true

[Hotkeys]
; Virtual key codes in hex. Nav-cluster defaults:
ToggleKey=0x23        ; End
RecenterKey=0x24      ; Home
PositionToggleKey=0x21; Page Up
YawModeKey=0x22       ; Page Down
; Chord alternatives (Ctrl+Shift+<letter>) for keyboards without a nav cluster:
ChordToggleKey=0x59   ; Y
ChordRecenterKey=0x54 ; T
ChordPositionKey=0x47 ; G
ChordYawModeKey=0x48  ; H

[General]
AutoEnable=true
; Horizon-locked yaw (true) is best for third-person games.
WorldSpaceYaw=true
; Set to false once camera offsets are confirmed - trims log noise.
CameraHookLogging=true

[Culling]
; Widens actor visibility culling so head turns do not reveal empty crowd edges.
; This does not change the rendered FOV. Ctrl+Shift+J toggles it in-game.
GuardEnabled=true
; Side-plane outward bias in metres.
GuardBiasMeters=500.0
