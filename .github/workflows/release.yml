name: Release
run-name: "Release ${{ github.ref_name }}"

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Extract version from tag
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            Write-Host "::error::Tag '$tag' does not match v<major>.<minor>.<patch>"
            exit 1
          }
          $version = $Matches[1]
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Release version: $version"

      - name: Validate version matches src/core/constants.h
        shell: pwsh
        run: |
          $constants = 'src/core/constants.h'
          $match = Select-String -Path $constants -Pattern 'ACUHT_VERSION\s*=\s*"([^"]+)"'
          if (-not $match) {
            Write-Host "::error::Could not extract ACUHT_VERSION from $constants"
            exit 1
          }
          $sourceVersion = $match.Matches[0].Groups[1].Value
          if ($sourceVersion -ne $env:RELEASE_VERSION) {
            Write-Host "::error::Tag version $($env:RELEASE_VERSION) does not match constants.h version $sourceVersion"
            exit 1
          }
          Write-Host "Version match: $sourceVersion"

      # C++ toolchain for the pixi `package` task's cmake/msbuild build.
      - name: Setup Visual Studio environment
        uses: microsoft/setup-msbuild@v3

      # Pixi is only a task runner (no conda dependencies); run-install: false
      # skips the empty-environment `pixi install`/`pixi list`. See build.yml.
      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          run-install: false

      # Same command as build.yml and developers run - no build logic in YAML.
      - name: Build and package
        shell: pwsh
        run: pixi run package

      - name: Generate release notes
        shell: pwsh
        run: |
          $script = 'cameraunlock-core/scripts/generate-release-notes.ps1'
          & $script `
            -Version $env:RELEASE_VERSION `
            -OutputFile 'release-notes.txt' `
            -ArtifactPaths @('src/', 'cameraunlock-core/', 'scripts/install.cmd', 'scripts/uninstall.cmd')
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Release notes generation failed"
            exit 1
          }

      - name: Find release ZIPs
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter "*-v$($env:RELEASE_VERSION)-installer.zip" | Select-Object -First 1
          $nexus = Get-ChildItem -Path release -Filter "*-v$($env:RELEASE_VERSION)-nexus.zip" | Select-Object -First 1
          if (-not $installer) { Write-Host "::error::Installer ZIP missing"; exit 1 }
          if (-not $nexus)     { Write-Host "::error::Nexus ZIP missing"; exit 1 }
          "INSTALLER_ZIP=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "NEXUS_ZIP=$($nexus.FullName)"         | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Installer: $($installer.Name)"
          Write-Host "Nexus:     $($nexus.Name)"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:RELEASE_TAG `
            --title "Assassin's Creed Unity Head Tracking $env:RELEASE_TAG" `
            --notes-file release-notes.txt `
            "$env:INSTALLER_ZIP" `
            "$env:NEXUS_ZIP"

      - name: Announce release to Discord
        shell: pwsh
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        run: |
          if (-not $env:DISCORD_RELEASE_WEBHOOK) {
            Write-Host "::notice::DISCORD_RELEASE_WEBHOOK not set; skipping Discord announcement."
            exit 0
          }
          $tag  = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"
          $name = (Get-Culture).TextInfo.ToTitleCase(((($repo -split '/')[-1]) -replace '-head-?tracking$','' -replace '-',' '))
          $url  = "https://github.com/$repo/releases/tag/$tag"
          $payload = @{
            username = 'Loopy Releases'
            embeds   = @(@{
              title       = "$name Head Tracking $tag"
              url         = $url
              description = "A new release of **$name Head Tracking** is live.`n`n**[Download the $tag release]($url)**"
              color       = 5814783
            })
          } | ConvertTo-Json -Depth 5
          Invoke-RestMethod -Uri $env:DISCORD_RELEASE_WEBHOOK -Method Post -ContentType 'application/json' -Body $payload
          Write-Host "Announced $tag to Discord."
